[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-monitor"
version = "0.1.0"
description = "Real-time anomaly monitor with async streaming agents, statistical + LLM detection, and HITL response orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adil Shamim8 / Super Z", email = "dev@example.com" }]
keywords = ["anomaly-detection", "langgraph", "streaming", "kafka", "redis", "observability", "hitl"]

dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "langgraph>=0.2,<0.3",
  "langchain-core>=0.3,<0.4",
  "langchain-openai>=0.2,<0.4",
  "openai>=1.40,<2",
  "redis>=5.0,<7",
  "aiokafka>=0.11,<0.13 ; python_version >= '3.10'",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "prometheus-client>=0.20,<0.22",
  "httpx>=0.27,<0.30",
  "structlog>=24.1,<26",
  "rich>=13.7,<14",
  "typer>=0.13,<0.15",
  "click>=8.1,<8.2",
  "tenacity>=8.2,<10",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<0.26",
  "pytest-cov>=5.0,<7",
  "ruff>=0.5,<0.8",
  "mypy>=1.10,<2",
  "respx>=0.21,<0.23",
]
notebooks = ["jupyter>=1.0,<2", "matplotlib>=3.8,<4"]

[project.scripts]
anomaly-monitor = "anomaly_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires external services (Kafka/Redis/OpenAI)",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
